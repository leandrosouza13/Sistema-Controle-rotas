<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Rotas V3</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Controle de Rotas V3</h1><button id="logout" hidden>Sair</button></header><main><section id="auth" class="card"><h2>Entrar</h2><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="login">Entrar</button><button id="signup">Criar conta</button><button id="google">Entrar com Google</button><p id="authMsg"></p></section><section id="setup" class="card" hidden><h2>Espaço compartilhado</h2><input id="spaceName" placeholder="Nome do espaço"><button id="createSpace">Criar espaço</button><hr><input id="inviteInput" placeholder="Código de convite"><button id="joinSpace">Entrar com código</button><p id="setupMsg"></p></section><section id="app" hidden><section class="card"><h2 id="spaceTitle"></h2><p id="who"></p><button id="invite">Gerar convite para compartilhar</button><p id="inviteCode"></p></section><section class="card"><h2>Dashboard</h2><select id="period"><option value="month">Mês atual</option><option value="today">Hoje</option><option value="7">Últimos 7 dias</option><option value="1">1ª quinzena</option><option value="2">2ª quinzena</option><option value="all">Tudo</option></select><button id="add">+ Nova rota</button><div id="metrics"></div></section><section class="card"><h2>Histórico</h2><div class="table"><table><thead><tr><th>Data</th><th>Pacotes</th><th>KM</th><th>R$/pacote</th><th>Ganho</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main><dialog id="modal"><form id="routeForm"><h2 id="formTitle">Nova rota</h2><input id="rid" type="hidden"><label>Data<input id="date" type="date" required></label><label>Pacotes<input id="packages" type="number" min="0" required></label><label>Valor por pacote (R$)<input id="rate" type="number" min="0" step=".01" required></label><h3>Onix</h3><label>KM inicial<input id="oi" type="number" min="0" step=".1" required></label><label>KM final<input id="of" type="number" min="0" step=".1" required></label><h3>Logan</h3><label>KM inicial<input id="li" type="number" min="0" step=".1" required></label><label>KM final<input id="lf" type="number" min="0" step=".1" required></label><label>Observação<textarea id="notes"></textarea></label><p id="preview"></p><button>Salvar</button><button type="button" id="cancel">Cancelar</button></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="script.js"></script></body></html>
